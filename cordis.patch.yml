# Default profile layer for @huahao/dsh-llm-claude.
#
# This package is a bundle, so `dsh plugin add` applies this patch automatically.
# The plugin is an interceptor, not a provider:
#   - it registers no route, no model catalog, and no credential;
#   - it reuses whatever provider route your profile already configured (for
#     example the `llm-pi-ai` gateway route);
#   - it takes over a request only when the model id starts with `claude-` and
#     the route's `api` is `anthropic-messages`; everything else is untouched.

- insert:
    - id: llm-claude-compat
      name: '@huahao/dsh-llm-claude'
      config:
        enabled: true
        # includeProviders: [gateway]   # empty = every reusable anthropic-messages route
        # excludeProviders: []
        claudeCodeCompat:
          identityBlocks: true
          userAgent: "claude-cli/2.1.293 (external, cli)"
          headers:
            x-app: cli
          metadataUserId: true
          toolSchema: names-only
          thinking: auto
        maxRequestImagesBytes: 20971520
        debug: false
