# Default profile layer for @hua03/dsh-llm-claude.
#
# A bundle patch is auto-applied by `dsh plugin add`, which is why this package
# declares `dsh.bundle.patch` in package.json: no manual edit of
# ~/.dsh/profiles/<profile>/cordis.patch.yml is needed for the default route.
#
# The default route points at the 该网关 Claude Code gateway because that is what
# the plugin exists for. Switch `baseURL`/`apiKeyEnv` here (or override the row
# by id in your own patch) for the official API or another gateway.

- insert:
    - id: llm-claude
      name: '@hua03/dsh-llm-claude'
      config:
        provider: claude-gateway
        displayName: 该网关 Claude
        baseURL: https://gateway.example.com/api
        apiKeyEnv: GATEWAY_API_KEY
        auth:
          header: x-api-key
        claudeCodeCompat:
          mode: auto
          identityBlocks: true
          userAgent: "claude-cli/2.1.293 (external, cli)"
          headers:
            x-app: cli
          metadataUserId: true
          toolSchema: names-only
        thinking:
          mode: auto
        reasoningEffort: high
        cacheRetention: short
        maxTokens: 64000
        streamIdleTimeoutMs: 300000
        models:
          - id: claude-haiku-5-5
            name: Claude Haiku 5.5
            contextWindow: 200000
            maxTokens: 64000
            inputModalities: [text, image]
            reasoning: false
          - id: claude-opus-5-5
            name: Claude Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            inputModalities: [text, image]
            reasoning: adaptive
            supportsTemperature: false
          - id: claude-sonnet-5-5
            name: Claude Sonnet 5.5
            contextWindow: 1000000
            maxTokens: 128000
            inputModalities: [text, image]
            reasoning: adaptive
